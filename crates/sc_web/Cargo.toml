[package]
name = "sc_web"
description = "Browser UI for the s-curve motion profile lab"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sc_core = { path = "../sc_core" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlInputElement",
  "HtmlSelectElement", "HtmlButtonElement", "Node", "NodeList", "DomTokenList", "CssStyleDeclaration",
  "Event", "EventTarget", "MouseEvent", "PointerEvent", "WheelEvent", "KeyboardEvent",
  "CanvasRenderingContext2d", "MediaQueryList", "Navigator", "DomRect", "Storage", "console",
  "WebGl2RenderingContext", "WebGlBuffer", "WebGlProgram", "WebGlShader", "WebGlUniformLocation",
  "WebGlVertexArrayObject", "WebGlContextAttributes", "AddEventListenerOptions",
]
